name: Temporary headless comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: temporary-headless-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.pull_request.number == 165 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_BUILD_CLIENT_PROFILE: official
      DSH_EXAMPLE_MODE: lib
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Record exact source and request references
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/headless-comparison"
          git rev-parse HEAD > "$RUNNER_TEMP/headless-comparison/source-sha.txt"
          printf '%s\n' "$BASE_REVISION" > "$RUNNER_TEMP/headless-comparison/base-sha.txt"
          printf '%s\n' "$HEAD_REVISION" > "$RUNNER_TEMP/headless-comparison/head-sha.txt"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frozen dependencies and original sandbox prerequisite
        run: |
          pnpm install --frozen-lockfile
          bash scripts/prepare-ci-bubblewrap.sh
      - name: Build original CI prerequisites
        run: pnpm run build
      - name: Add only the scoped assertion diagnostic
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          path = Path('apps/cli/tests/profiles/headless/tests/headless.expected.e2e.ts')
          source = path.read_text()
          marker = "  it('keeps provider comments alive and sends DeepSeek defaults through the one-shot app',"
          start = source.index(marker)
          end = source.index('\n  it(', start + len(marker))
          case = source[start:end]
          original = '      expect(server.requests).toHaveLength(2)'
          diagnostic = '''      const retries = parseJsonl(result.stdout).flatMap((record) => {
                  const event = record.event
                  if (event === null || typeof event !== 'object' || Array.isArray(event) || event.type !== 'llm/retry') return []
                  const data = event.data as JsonObject
                  const failure = data.failure as JsonObject
                  return [{ retry: data.retry, code: failure.code, message: failure.message }]
                })
                const requestCounts = {
                  main: server.requests.filter(request => request.max_tokens === 256_000).length,
                  title: server.requests.filter(request => request.max_tokens === 64).length,
                  other: server.requests.filter(request => request.max_tokens !== 256_000 && request.max_tokens !== 64).length,
                }
                expect(server.requests, JSON.stringify({ requestCounts, retries })).toHaveLength(2)'''
          assert case.count(original) == 1, 'unexpected provider defaults fixture layout'
          path.write_text(source[:start] + case.replace(original, diagnostic) + source[end:])
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) <= {str(path)}, changed
          output = Path(os.environ['RUNNER_TEMP']) / 'headless-comparison'
          (output / 'fixture.patch').write_bytes(subprocess.check_output(['git', 'diff', '--', str(path)]))
          PY
      - name: Run only the original provider defaults case
        run: |
          set -o pipefail
          pnpm exec vitest run --config vitest.expected.config.ts \
            apps/cli/tests/profiles/headless/tests/headless.expected.e2e.ts \
            -t 'keeps provider comments alive and sends DeepSeek defaults through the one-shot app' \
            2>&1 | tee "$RUNNER_TEMP/headless-comparison/diagnostic.log"
      - name: Upload source references and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-comparison-${{ matrix.revision }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/headless-comparison
          if-no-files-found: error
          retention-days: 3
