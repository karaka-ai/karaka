name: Temporary heartbeat control

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: temporary-headless-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.pull_request.number == 165 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRIMARY_NODE_VERSION: '24'
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '2'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      DSH_OXLINT_THREADS: '2'
      DSH_PUBLINT_CONCURRENCY: '2'
      DSH_WEB_SNAPSHOT_WORKERS: '2'
      DSH_GATE_FAIL_FAST: '1'
      DSH_SNAPSHOT_MAX_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Record exact source and request references
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/headless-comparison"
          git rev-parse HEAD > "$RUNNER_TEMP/headless-comparison/source-sha.txt"
          printf '%s\n' "$BASE_REVISION" > "$RUNNER_TEMP/headless-comparison/base-sha.txt"
          printf '%s\n' "$HEAD_REVISION" > "$RUNNER_TEMP/headless-comparison/head-sha.txt"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP%/*}/ms-playwright" >> "$GITHUB_ENV"
          echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      - name: Install Playwright Chromium and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Add only the scoped assertion diagnostic
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          path = Path('apps/cli/tests/profiles/headless/tests/headless.expected.e2e.ts')
          source = path.read_text()
          marker = "  it('keeps provider comments alive and sends DeepSeek defaults through the one-shot app',"
          start = source.index(marker)
          end = source.index('\n  it(', start + len(marker))
          case = source[start:end]
          original = '      expect(server.requests).toHaveLength(2)'
          diagnostic = '''      const retries = parseJsonl(result.stdout).flatMap((record) => {
                  const event = record.event
                  if (event === null || typeof event !== 'object' || Array.isArray(event)
                    || !('type' in event) || event.type !== 'llm/retry' || !('data' in event)) return []
                  const data = event.data as JsonObject
                  const failure = data.failure as JsonObject
                  return [{ retry: data.retry, code: failure.code, message: failure.message }]
                })
                const requestCounts = {
                  main: server.requests.filter(request => request.max_tokens === 256_000).length,
                  title: server.requests.filter(request => request.max_tokens === 64).length,
                  other: server.requests.filter(request => request.max_tokens !== 256_000 && request.max_tokens !== 64).length,
                }
                expect(server.requests, JSON.stringify({ requestCounts, retries })).toHaveLength(2)'''
          assert case.count(original) == 1, 'unexpected provider defaults fixture layout'
          path.write_text(source[:start] + case.replace(original, diagnostic) + source[end:])
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) <= {str(path)}, changed
          output = Path(os.environ['RUNNER_TEMP']) / 'headless-comparison'
          (output / 'fixture.patch').write_bytes(subprocess.check_output(['git', 'diff', '--', str(path)]))
          PY
      - name: Run the original artifact lane with its normal fan-out
        run: |
          set -o pipefail
          pnpm run check:ci:consumers 2>&1 | tee "$RUNNER_TEMP/headless-comparison/diagnostic.log"
      - name: Suppress only the first primary request's comments
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          path = Path('apps/cli/tests/profiles/headless/tests/headless.expected.e2e.ts')
          source = path.read_text()
          marker = '      requests.push(JSON.parse(body) as JsonObject)'
          replacement = marker + "\n      const omitHeartbeat = requests.at(-1)?.max_tokens === 256_000\n        && requests.filter(request => request.max_tokens === 256_000).length === 1"
          assert source.count(marker) == 1
          source = source.replace(marker, replacement)
          header = "      response.writeHead(200, { 'content-type': 'text/event-stream' })"
          assert source.count(header) == 1
          source = source.replace(header, header + "\n      if (omitHeartbeat) response.flushHeaders()")
          comment = "          response.write(': keep-alive\\n\\n')"
          assert source.count(comment) == 1
          source = source.replace(comment, "          if (!omitHeartbeat) response.write(': keep-alive\\n\\n')")
          path.write_text(source)
          output = Path(os.environ['RUNNER_TEMP']) / 'headless-comparison'
          (output / 'negative-control.patch').write_bytes(subprocess.check_output(['git', 'diff', '--', str(path)]))
          PY
      - name: Require the original assertion to reject the missing heartbeat
        env:
          DSH_EXAMPLE_MODE: lib
        run: |
          set +e
          pnpm exec vitest run --config vitest.expected.config.ts apps/cli/tests/profiles/headless/tests/headless.expected.e2e.ts -t 'keeps provider comments alive and sends DeepSeek defaults through the one-shot app' 2>&1 | tee "$RUNNER_TEMP/headless-comparison/negative-control.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/headless-comparison/negative-control-exit.txt"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'headless-comparison'
          assert int((output / 'negative-control-exit.txt').read_text()) != 0, 'missing heartbeat unexpectedly passed'
          log = re.sub(r'\x1b\[[0-9;]*m', '', (output / 'negative-control.log').read_text())
          match = re.search(r'AssertionError: (\{.*?\}): expected', log)
          assert match is not None, 'missing expected request-count diagnostic'
          diagnostic = json.loads(match.group(1))
          assert diagnostic['requestCounts'] == {'main': 2, 'title': 1, 'other': 0}, diagnostic
          assert len(diagnostic['retries']) == 1, diagnostic
          assert diagnostic['retries'][0].get('retry') == 1, diagnostic
          assert diagnostic['retries'][0].get('code') == 'TIMEOUT', diagnostic
          (output / 'negative-control-result.json').write_text(json.dumps(diagnostic, indent=2) + '\n')
          PY
      - name: Record final tracked-change scope
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True)
          output = Path(os.environ['RUNNER_TEMP']) / 'headless-comparison'
          (output / 'final-changed-paths.txt').write_text(changed)
          assert set(changed.splitlines()) <= {'apps/cli/tests/profiles/headless/tests/headless.expected.e2e.ts'}, changed
          PYTHON
      - name: Upload source references and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heartbeat-control-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/headless-comparison
          if-no-files-found: error
          retention-days: 3
