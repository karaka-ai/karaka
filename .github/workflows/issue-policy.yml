name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Target event repository
        env:
          POLICY_ORGANIZATION: ${{ github.repository_owner }}
          POLICY_REPOSITORY: ${{ github.event.repository.name }}
        run: >-
          node --input-type=module -e "import fs from 'node:fs';
          const path = '.github/issue-management/config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.organization = process.env.POLICY_ORGANIZATION;
          config.repository = process.env.POLICY_REPOSITORY;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n')"
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
