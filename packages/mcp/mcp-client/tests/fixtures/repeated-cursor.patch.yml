- insert:
    - id: mcp-pagination-cycle
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: pagination-cycle
        command: !!js process.execPath
        args: !!js '[process.env.DSH_MCP_PAGINATION_FIXTURE]'
        failOnStartupError: true
        reconnect:
          enabled: false
